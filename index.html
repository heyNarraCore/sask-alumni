:root{
  --bg:#FFFFFF; --card:#FFFFFF; --ink:#000000; --sub:#6F6F76; --line:#EAEAEA;
  --chip:#F4F4F6; --blue:#0F6BFF; --sky:#77ABFF; --violet:#7E87FF; --pink:#EB73FF; --magenta:#D948F6; --salmon:#FFA5A5;
  --grad:linear-gradient(135deg,#D948F6,#2C6BFF);
  --grad-soft:linear-gradient(120deg,rgba(119,171,255,.16),rgba(126,135,255,.14) 45%,rgba(235,115,255,.12));
  --active-bg:#E7F0FF; --active-ink:#0F6BFF;
  --purple-bg:#F7E9FE; --purple-ink:#B02BD6;
  --red-bg:#FFECEC; --red-ink:#D96A6A;
  --gray-bg:#F0F0F2; --gray-ink:#6F6F76;
  --amber-bg:var(--grad-soft); --amber-ink:#000;
}
*{margin:0;padding:0;box-sizing:border-box}
html{scroll-behavior:smooth}
body{background:var(--bg);color:var(--ink);font-family:'Atyp Display',-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;font-size:14px;line-height:1.55;-webkit-font-smoothing:antialiased}
h1,h2,h3,.rname,.nm,.stat b,.dtitle h1{font-family:'Atyp Display',sans-serif;font-weight:700}
/* brand gradient glow */
.glow{position:absolute;top:0;left:0;right:0;height:340px;pointer-events:none;z-index:-1;
  background:
   radial-gradient(60% 240px at 15% 0%,rgba(119,171,255,.35),transparent 70%),
   radial-gradient(50% 260px at 55% 0%,rgba(126,135,255,.28),transparent 70%),
   radial-gradient(55% 240px at 90% 0%,rgba(235,115,255,.25),transparent 70%),
   radial-gradient(40% 200px at 75% 0%,rgba(255,165,165,.18),transparent 70%)}
a{color:inherit;text-decoration:none}
button{font-family:inherit;cursor:pointer}
.wrap{max-width:1080px;margin:0 auto;padding:0 28px}
/* header */
header{position:sticky;top:0;z-index:50;background:rgba(255,255,255,.82);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.hrow{display:flex;align-items:center;gap:18px;height:62px}
.logo{display:flex;align-items:center}
.logo svg{height:26px;width:auto;display:block}
.hspace{flex:1}
.hbtn{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:7px 15px;font-size:12.5px;font-weight:600;color:var(--ink);transition:.15s}
.hbtn:hover{border-color:var(--violet)}
.hbtn.dark{background:var(--ink);color:#fff;border-color:var(--ink)}
/* hero + stats */
.hero{padding:52px 0 8px;position:relative}
.hero h1{font-size:38px;letter-spacing:-.5px}
.hero p{color:var(--sub);margin-top:8px;max-width:640px}
.stats{display:flex;gap:14px;margin:28px 0 4px;flex-wrap:wrap}
.stat{background:rgba(255,255,255,.7);backdrop-filter:blur(4px);border:1px solid var(--line);border-radius:18px;padding:14px 20px;min-width:132px}
.stat b{font-size:23px;letter-spacing:-.5px;display:block;background:var(--grad);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
.stat span{color:var(--sub);font-size:12px}
/* controls */
.controls{display:flex;gap:10px;margin:20px 0 14px;flex-wrap:wrap;align-items:center}
.search{flex:1;min-width:220px;position:relative}
.search input{width:100%;padding:10px 14px 10px 36px;border:1px solid var(--line);border-radius:999px;background:var(--card);font-size:13.5px;outline:none;font-family:inherit}
.search input:focus{border-color:var(--violet);box-shadow:0 0 0 3px rgba(126,135,255,.15)}
.search svg{position:absolute;left:13px;top:50%;transform:translateY(-50%);opacity:.4}
.fchip{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:7px 14px;font-size:12.5px;font-weight:600;color:var(--sub);transition:.15s}
.fchip.on{background:var(--ink);color:#fff;border-color:var(--ink)}
select{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:7px 12px;font-size:12.5px;font-weight:600;color:var(--sub);outline:none;font-family:inherit;cursor:pointer}
.rescount{color:var(--sub);font-size:12px;margin:2px 0 10px}
/* list */
.list{display:flex;flex-direction:column;gap:0;background:var(--card);border:1px solid var(--line);border-radius:16px;overflow:hidden;margin-bottom:60px}
.row{display:flex;align-items:center;gap:16px;padding:10px 22px;border-bottom:1px solid #F3F3F5;cursor:pointer;transition:background .12s}
.row:last-child{border-bottom:none}
.row:hover{background:linear-gradient(120deg,rgba(119,171,255,.06),rgba(235,115,255,.05))}
.mono{width:44px;height:44px;min-width:44px;border-radius:12px;background:var(--grad);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:17px;overflow:hidden;font-family:'Atyp Display',sans-serif}
.mono.haslogo{background:#fff;border:1px solid var(--line)}
.mono img{width:100%;height:100%;object-fit:contain}
.rmain{flex:1;min-width:0;padding:6px 0}
.rname{font-weight:700;font-size:14.5px;letter-spacing:-.2px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.rtag{color:var(--sub);font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:520px}
.rmeta{display:flex;gap:6px;align-items:center;flex-wrap:wrap;justify-content:flex-end}
.chip{display:inline-block;padding:2.5px 9px;border-radius:999px;font-size:10.5px;font-weight:600;background:var(--chip);color:var(--gray-ink);white-space:nowrap}
.chip.Active{background:var(--active-bg);color:var(--active-ink)}
.chip.Acquired,.chip.Exited{background:var(--purple-bg);color:var(--purple-ink)}
.chip.Inactive{background:var(--red-bg);color:var(--red-ink)}
.chip.Unknown{background:var(--gray-bg);color:var(--gray-ink)}
.chip.sask{background:var(--grad);color:#fff}
.chip.edited{background:#EAF1FF;color:#0F6BFF}
.ryear{color:var(--sub);font-size:12px;width:44px;text-align:right}
.arrow{color:#C6C6CE;font-size:16px}
.empty{padding:60px;text-align:center;color:var(--sub)}
/* card grid (YC-style directory) */
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px;margin-bottom:60px}
.scard{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px;cursor:pointer;transition:.15s;display:flex;flex-direction:column;gap:10px}
.scard:hover{border-color:var(--violet);transform:translateY(-1px);box-shadow:0 6px 20px rgba(126,135,255,.14)}
.scard .top{display:flex;align-items:center;gap:11px}
.scard .nm{font-weight:700;font-size:14.5px;letter-spacing:-.2px;line-height:1.25}
.scard .ed{font-size:11px;color:var(--sub)}
.scard .tg2{color:var(--sub);font-size:12.5px;line-height:1.45;flex:1;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.scard .ch{display:flex;gap:5px;flex-wrap:wrap}
.vtog{display:flex;border:1px solid var(--line);border-radius:999px;overflow:hidden;background:var(--card)}
.vtog button{border:none;background:none;padding:7px 12px;font-size:12.5px;color:var(--sub);font-weight:600}
.vtog button.on{background:var(--ink);color:#fff}
.chip.edition{background:#EEF0FF;color:#6A73E8}
/* gallery */
.gal{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px}
.gitem{position:relative;border-radius:12px;overflow:hidden;border:1px solid var(--line);background:#fff;cursor:zoom-in;aspect-ratio:4/3}
.gitem img{width:100%;height:100%;object-fit:cover;display:block;transition:.2s}
.gitem:hover img{transform:scale(1.03)}
.gitem .cap{position:absolute;left:0;right:0;bottom:0;background:linear-gradient(transparent,rgba(0,0,0,.55));color:#fff;font-size:11px;padding:14px 9px 7px;pointer-events:none}
.lb{position:fixed;inset:0;background:rgba(15,14,10,.9);z-index:300;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:14px}
.lb img{max-width:88vw;max-height:78vh;border-radius:10px;box-shadow:0 10px 50px rgba(0,0,0,.5)}
.lb .lcap{color:#fff;font-size:13px;opacity:.85}
.lb button{position:absolute;background:rgba(255,255,255,.12);border:none;color:#fff;border-radius:50%;width:42px;height:42px;font-size:18px}
.lb .lx{top:20px;right:22px}.lb .lp{left:18px;top:50%;transform:translateY(-50%)}.lb .ln{right:18px;top:50%;transform:translateY(-50%)}
.galedit{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;margin-bottom:10px}
.galedit .gitem{cursor:default;aspect-ratio:auto}
.galedit .gitem img{aspect-ratio:4/3}
.galedit .del{position:absolute;top:6px;right:6px;z-index:2}
.galedit input{width:100%;border:none;border-top:1px solid var(--line);padding:5px 8px;font-size:11px;font-family:inherit;outline:none}
/* hero banner (swap-ready placeholder) */
.banner{margin-top:22px;border-radius:22px;overflow:hidden;position:relative;min-height:200px;display:flex;align-items:center;background:var(--ink)}
.banner:before{content:"";position:absolute;inset:0;background:radial-gradient(70% 160% at 85% 0%,rgba(217,72,246,.5),transparent 60%),radial-gradient(60% 160% at 10% 100%,rgba(44,107,255,.45),transparent 60%),radial-gradient(40% 120% at 50% 50%,rgba(119,171,255,.25),transparent 70%)}
.banner img{width:100%;height:100%;object-fit:cover;display:block;position:absolute;inset:0}
.banner .btxt{position:relative;padding:44px;color:#fff}
.banner .btxt h2{font-size:clamp(24px,4vw,34px);letter-spacing:-.8px;margin:0 0 6px;border:none;padding:0;display:block}
.banner .btxt p{color:rgba(255,255,255,.78);font-size:14px;max-width:520px}
/* section labels */
.section-label{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin:44px 0 14px;flex-wrap:wrap}
.section-label h2{font-size:20px;letter-spacing:-.3px;border:none;padding:0;margin:0;display:block}
.section-label p{color:var(--sub);font-size:12.5px;max-width:460px}
/* edition rail */
.edition-rail{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 16px;scrollbar-width:thin}
.edition-rail::-webkit-scrollbar{height:6px}
.edition-rail::-webkit-scrollbar-thumb{background:var(--line);border-radius:4px}
.ed-chip{flex:0 0 auto;border:1px solid var(--line);background:var(--card);border-radius:14px;padding:10px 16px 12px;text-align:center;min-width:72px;transition:.15s;cursor:pointer}
.ed-chip:hover{border-color:var(--violet)}
.ed-chip b{display:block;font-size:15px;letter-spacing:-.3px;font-variant-numeric:tabular-nums}
.ed-chip span{display:block;font-size:10px;color:var(--sub);margin-top:1px}
.ed-chip .bar{height:4px;border-radius:2px;background:var(--chip);margin-top:8px;overflow:hidden}
.ed-chip .bar i{display:block;height:100%;background:var(--grad);border-radius:2px}
.ed-chip.on{background:var(--ink);border-color:var(--ink)}
.ed-chip.on b{color:#fff}
.ed-chip.on span{color:rgba(255,255,255,.6)}
.ed-chip.on .bar{background:rgba(255,255,255,.25)}
.ed-chip.on .bar i{background:#fff}
/* infographics */
.infogrid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-bottom:8px}
.fungrid{display:grid;grid-template-columns:1fr;gap:14px;margin-bottom:8px}
.info-card{grid-column:span 1;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:22px;display:flex;flex-direction:column}
.info-card.wide{grid-column:span 2}
.info-card h3{font-size:14px;font-weight:700}
.info-card p.desc{color:var(--sub);font-size:11.5px;margin-top:3px;margin-bottom:16px}
.chart-wrap{position:relative;height:210px;flex:none;width:100%;overflow:hidden}
.chart-wrap.tall{height:240px}
.chart-wrap canvas{max-width:100%!important}
.legend-list{display:flex;flex-direction:column;gap:8px;margin-top:14px}
.legend-row{display:flex;align-items:center;gap:8px;font-size:12.5px}
.legend-dot{width:9px;height:9px;border-radius:50%;flex:0 0 auto}
.legend-row .lname{flex:1;color:var(--ink)}
.legend-row b{font-variant-numeric:tabular-nums}
.bignum{font-size:46px;font-weight:700;letter-spacing:-1.2px;background:var(--grad);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;line-height:1}
.bignum-label{color:var(--sub);font-size:12.5px;margin-top:6px}
.founder-hof{margin-top:16px;display:flex;flex-direction:column;gap:7px}
.founder-hof .fh-row{display:flex;justify-content:space-between;gap:8px;font-size:12px;padding:8px 11px;background:var(--chip);border-radius:10px}
.founder-hof .fh-row b{font-variant-numeric:tabular-nums;color:var(--violet)}
.caveat{font-size:10.5px;color:var(--sub);margin-top:14px;padding-top:12px;border-top:1px dashed var(--line);line-height:1.5}
.sec-cloud{display:flex;flex-wrap:wrap;gap:7px;align-content:flex-start;overflow-y:auto;max-height:300px}
.sec-chip{border:1px solid var(--line);background:#fff;border-radius:999px;padding:6px 12px;font-size:12px;font-weight:600;color:var(--ink);cursor:pointer;transition:.15s;display:inline-flex;align-items:center;gap:6px}
.sec-chip b{color:var(--c);font-variant-numeric:tabular-nums}
.sec-chip:hover{border-color:var(--c)}
/* facts */
.fact-card h3{font-size:14px}
.fact-display{min-height:64px;display:flex;align-items:center;font-size:15px;line-height:1.55;font-weight:600;color:var(--ink);padding:10px 0;transition:opacity .25s ease}
.fact-display b{color:var(--blue)}
.fact-controls{display:flex;align-items:center;justify-content:space-between;margin-top:8px;gap:10px}
.fact-dots{display:flex;gap:5px;flex-wrap:wrap}
.fact-dot{width:6px;height:6px;border-radius:50%;background:var(--line);transition:.15s}
.fact-dot.on{background:var(--blue);width:16px;border-radius:3px}
@media(max-width:860px){.infogrid{grid-template-columns:1fr 1fr}.info-card.wide{grid-column:span 2}}
@media(max-width:560px){.infogrid{grid-template-columns:1fr}.info-card.wide{grid-column:span 1}}
/* prev-next + similar */
.pn{display:flex;gap:8px;margin-left:auto}
.pn a{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:6px 13px;font-size:12px;font-weight:600;color:var(--sub)}
.pn a:hover{color:var(--ink);border-color:var(--violet)}
.sim{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px}
/* detail */
.back{display:inline-flex;align-items:center;gap:6px;color:var(--sub);font-size:12.5px;margin:26px 0 20px;cursor:pointer;background:none;border:none}
.back:hover{color:var(--ink)}
.dhead{display:flex;gap:22px;align-items:flex-start;flex-wrap:wrap;margin-bottom:34px}
.mono.big{width:76px;height:76px;min-width:76px;border-radius:18px;font-size:30px}
.dtitle{flex:1;min-width:260px}
.dtitle h1{font-size:36px;font-weight:800;letter-spacing:-1.2px;line-height:1.1}
.dtitle .tg{color:var(--sub);font-size:15px;margin:7px 0 12px}
.dbtns{display:flex;gap:9px;align-items:center;flex-wrap:wrap;padding-top:10px}
.grid{display:grid;grid-template-columns:1fr 320px;gap:34px;padding-bottom:80px}
@media(max-width:860px){.grid{grid-template-columns:1fr}}
.sect{margin-bottom:38px}
.sect h2{font-size:15px;font-weight:700;letter-spacing:-.2px;padding-bottom:10px;border-bottom:1px solid var(--line);margin-bottom:16px;display:flex;justify-content:space-between;align-items:center}
.kv{display:grid;grid-template-columns:150px 1fr;row-gap:9px;font-size:13.5px}
.kv .k{color:var(--sub)}
/* timeline */
.tl{position:relative;padding-left:22px}
.tl:before{content:"";position:absolute;left:5px;top:8px;bottom:8px;width:2px;background:linear-gradient(180deg,#D948F6,#2C6BFF)}
.tli{position:relative;margin-bottom:20px}
.tli:before{content:"";position:absolute;left:-22px;top:5px;width:11px;height:11px;border-radius:50%;background:var(--grad);border:2.5px solid var(--bg)}
.tli b{font-size:13.5px;font-weight:700;display:block}
.tli span{color:var(--sub);font-size:12.5px}
/* news */
.news{display:flex;flex-direction:column}
.nitem{display:flex;gap:18px;padding:13px 2px;border-bottom:1px solid #F3F3F5;align-items:baseline}
.nitem:last-child{border:none}
.ndate{color:var(--sub);font-size:12px;min-width:76px;white-space:nowrap}
.nbody{flex:1}
.nbody b{font-size:13.5px;font-weight:650;display:block;line-height:1.4}
.nbody span{color:var(--sub);font-size:12px}
.nbody a{color:var(--blue)}
.narrow{color:#C6C6CE}
/* sidebar cards */
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:20px 22px;margin-bottom:18px}
.card h3{font-size:11px;font-weight:700;letter-spacing:1.2px;text-transform:uppercase;color:var(--sub);margin-bottom:14px}
.founder{display:flex;gap:11px;align-items:center;padding:8px 0;border-bottom:1px solid #F3F3F5}
.founder:last-child{border:none}
.fmono{width:32px;height:32px;min-width:32px;border-radius:50%;background:var(--chip);display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;color:var(--sub)}
.founder b{font-size:13px;font-weight:650;display:block}
.founder span{font-size:11.5px;color:var(--sub);display:block}
.founder a{font-size:11.5px;color:var(--blue);word-break:break-all}
.saskcard{background:var(--grad-soft);border-color:#DCD4F5;position:relative;overflow:hidden}
.saskcard:before{content:"";position:absolute;top:0;left:0;right:0;height:3px;background:var(--grad)}
.saskcard h3{color:var(--ink)}
.saskcard .p{font-weight:700;font-size:13.5px;margin-bottom:6px}
.saskcard .n{font-size:12.5px;color:#4A4A55}
.srcs{font-size:11.5px;color:var(--sub);word-break:break-all;line-height:1.9}
.srcs a{color:var(--blue)}
.conf{font-size:11px;color:var(--sub);font-style:italic}
/* edit mode */
.editable .ef{border:1px dashed #C3C8F0;background:#FAFBFF;border-radius:8px;padding:4px 8px;font-family:inherit;font-size:13px;width:100%;outline:none;color:var(--ink)}
textarea.ef{resize:vertical;min-height:64px;line-height:1.5}
.erow{display:flex;gap:6px;margin-bottom:7px;align-items:center}
.erow .ef{flex:1}
.del{border:none;background:var(--red-bg);color:var(--red-ink);border-radius:6px;width:26px;height:26px;min-width:26px;font-size:13px;line-height:1}
.addrow{border:1px dashed var(--line);background:none;border-radius:8px;padding:6px 12px;font-size:12px;color:var(--sub);width:100%}
.ebar{position:fixed;bottom:0;left:0;right:0;background:var(--ink);color:#fff;z-index:100;padding:12px 0}
.ebar .wrap{display:flex;align-items:center;gap:12px}
.ebar span{flex:1;font-size:13px;opacity:.85}
.ebar button{border-radius:999px;padding:8px 20px;font-size:13px;font-weight:600;border:1px solid rgba(255,255,255,.3);background:none;color:#fff}
.ebar button.save{background:#fff;color:var(--ink);border-color:#fff}
footer{border-top:1px solid var(--line);padding:26px 0 40px;color:var(--sub);font-size:12px;display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 22px;border-radius:999px;font-size:13px;z-index:200;opacity:0;transition:.25s;pointer-events:none}
.toast.show{opacity:1}
@media print{header,.controls,.dbtns,.ebar{display:none}}
body.readonly .adminonly{display:none!important}
</style>
</head>

const READONLY = true;

const LS_KEY='sask_db_v1';
let overrides={}, added=[], removed=[];
if(!READONLY){try{const s=JSON.parse(localStorage.getItem(LS_KEY)||'{}');overrides=s.overrides||{};added=s.added||[];removed=s.removed||[];}catch(e){}}
function persist(){
  if(READONLY)return;
  try{localStorage.setItem(LS_KEY,JSON.stringify({overrides,added,removed}));}
  catch(e){toast('⚠ Local storage full — remove some images or export JSON to keep your data');}
  updateResetBtn();
}
function getData(){
  const base=SEED.filter(s=>!removed.includes(s.id)).map(s=>overrides[s.id]?{...overrides[s.id],_edited:true}:s);
  return base.concat(added.map(s=>({...s,_edited:true}))).sort((a,b)=>a.name.toLowerCase().replace(/^[^a-z0-9]+/,'').localeCompare(b.name.toLowerCase().replace(/^[^a-z0-9]+/,'')));
}
function byId(id){return getData().find(s=>s.id===id);}

function inferGender(full){const p=(full||'').trim().split(/\s+/);if(!p.length||!p[0])return 'unknown';const last=p[p.length-1];if(/ov[áa]$/i.test(last))return 'female';if(FEMALE_FIRST.has(p[0]))return 'female';if(MALE_FIRST.has(p[0]))return 'male';return 'unknown';}

function statsFor(data){
  const nAct=data.filter(s=>s.stage==='Active').length;
  const nAcq=data.filter(s=>['Acquired','Exited'].includes(s.stage)).length;
  const nInact=data.filter(s=>s.stage==='Inactive').length;
  const nUnk=data.length-nAct-nAcq-nInact;
  const secCount={};data.forEach(s=>{const g=sectorGroup(s);secCount[g]=(secCount[g]||0)+1;});
  let secSorted=Object.entries(secCount).sort((a,b)=>b[1]-a[1]);
  const top=secSorted.slice(0,7);const rest=secSorted.slice(7).reduce((a,[,v])=>a+v,0);
  if(rest>0)top.push(['Other',rest]);
  const rows=[];data.forEach(s=>(s.founders||[]).forEach(f=>{if(f&&f.name)rows.push({name:f.name.trim(),startup:s.name});}));
  const byName={};rows.forEach(f=>{(byName[f.name]=byName[f.name]||new Set()).add(f.startup);});
  const uniq=Object.keys(byName);
  const serial=uniq.filter(n=>byName[n].size>1).sort((a,b)=>byName[b].size-byName[a].size);
  let gM=0,gF=0,gU=0;uniq.forEach(n=>{const g=inferGender(n);if(g==='female')gF++;else if(g==='male')gM++;else gU++;});
  const hqCount={};data.forEach(s=>{const g=hqGroup(s);hqCount[g]=(hqCount[g]||0)+1;});
  return {total:data.length,nAct,nAcq,nInact,nUnk,sectors:top,
    founders:{unique:uniq.length,serial:serial.length,top:serial.slice(0,5).map(n=>({name:n,count:byName[n].size}))},
    gender:{male:gM,female:gF,unknown:gU},hq:hqCount,totalFounders:rows.length,
    avgFounders:data.length?rows.length/data.length:0};
}
function edFiltered(){const data=getData();return editionF==='All'?data:data.filter(s=>edYears(s).includes(+editionF));}
function donut(id,labels,values,colors){
  const c=document.getElementById(id);if(!c||!window.Chart)return;
  if(charts[id])charts[id].destroy();
  charts[id]=new Chart(c.getContext('2d'),{type:'doughnut',data:{labels,datasets:[{data:values,backgroundColor:colors,borderWidth:0}]},
    options:{cutout:'68%',responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false}},animation:{duration:400}}});
}
function hbar(id,labels,values,colors){
  const c=document.getElementById(id);if(!c||!window.Chart)return;
  if(charts[id])charts[id].destroy();
  charts[id]=new Chart(c.getContext('2d'),{type:'bar',data:{labels,datasets:[{data:values,backgroundColor:colors,borderRadius:6,barThickness:16}]},
    options:{indexAxis:'y',responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false}},
      scales:{x:{grid:{color:'#F3F3F5'},ticks:{font:{size:11}}},y:{grid:{display:false},ticks:{font:{size:11.5}}}},animation:{duration:400}}});
}
function legendHTML(labels,values,colors){
  const tot=values.reduce((a,b)=>a+b,0)||1;
  return labels.map((l,i)=>`<div class="legend-row"><span class="legend-dot" style="background:${colors[i]}"></span><span class="lname">${esc(l)}</span><b>${values[i]} (${Math.round(values[i]/tot*100)} %)</b></div>`).join('');
}
function buildFacts(){
  const data=getData(),facts=[];
  const firstNames={};data.forEach(s=>(s.founders||[]).forEach(f=>{const fn=(f.name||'').trim().split(/\s+/)[0];if(fn)firstNames[fn]=(firstNames[fn]||0)+1;}));
  const topName=Object.entries(firstNames).sort((a,b)=>b[1]-a[1])[0];
  if(topName)facts.push(`👤 The most common founder first name in the database is <b>${esc(topName[0])}</b> — it appears ${topName[1]}×.`);
  const maxF=data.reduce((a,b)=>((b.founders||[]).length>(a.founders||[]).length?b:a),data[0]);
  if(maxF&&(maxF.founders||[]).length>1)facts.push(`👥 The biggest founding team belongs to <b>${esc(maxF.name)}</b> — ${(maxF.founders||[]).length} people in one startup.`);
  const solo=data.filter(s=>(s.founders||[]).length===1).length;
  facts.push(`🧑‍💻 ${solo} of ${data.length} startups (${Math.round(solo/data.length*100)} %) were founded by a single person.`);
  const multiEd=data.filter(s=>edYears(s).length>1);
  if(multiEd.length)facts.push(`🔁 ${multiEd.length} startup${multiEd.length>1?'s':''} competed in more than one SASK edition — e.g. <b>${esc(multiEd[0].name)}</b> (${edYears(multiEd[0]).join(' & ')}).`);
  const activeFounded=data.filter(s=>s.stage==='Active'&&s.founded).sort((a,b)=>String(a.founded).localeCompare(String(b.founded)));
  if(activeFounded.length)facts.push(`🕰️ The oldest still-active company in the database is <b>${esc(activeFounded[0].name)}</b> — running since ${esc(activeFounded[0].founded)}.`);
  const aiCount=data.filter(s=>/\bAI\b/i.test((s.tagline||'')+' '+(s.sector||''))).length;
  if(aiCount)facts.push(`🤖 "AI" appears in the profile of ${aiCount} startups — that's ${Math.round(aiCount/data.length*100)} % of the whole database.`);
  const topSec=Object.entries(data.reduce((m,s)=>{const g=sectorGroup(s);m[g]=(m[g]||0)+1;return m;},{})).sort((a,b)=>b[1]-a[1])[0];
  if(topSec)facts.push(`🏆 The strongest sector is <b>${esc(topSec[0])}</b> with ${topSec[1]} startups.`);
  const acq=data.filter(s=>['Acquired','Exited'].includes(s.stage));
  if(acq.length)facts.push(`💼 ${acq.length} alumni have been acquired or exited — including deals with Cisco, Epic Games, Lyft and Zebra Technologies.`);
  const y2011=data.filter(s=>edYears(s).includes(2011)).length;
  if(y2011)facts.push(`🎂 It all started in 2011 with a single category and ${y2011} finalists in the database — today it spans 13 editions and ${data.length} startups.`);
  facts.push(`🚀 <b>Katarína Šimková</b>, co-founder of Staffino (in this database), also built Deal Factory and now leads CloseRocket, which raised a €1.2M investment.`);
  facts.push(`📈 <b>Bohumil Pokštefl</b> led Kontentino as CEO for almost 7 years — today he runs Deal Harvest and the SaaS Garden mentoring project.`);
  facts.push(`📣 <b>Tomáš Rosputinský</b> and <b>Ivan Dvoran</b>, founders of Staffino, are also behind the ad agency THIS IS LOCCO.`);
  facts.push(`🌊 <b>Pavol Turčina</b>, CEO of GOSPACE LABS and co-founder of Fleximodo, is also behind the water-management IoT project Meratch — both are in this database.`);
  const money=data.filter(s=>/[€$]\s?[\d,.]+/.test(s.capital_raised||''));
  if(money.length)facts.push(`💰 ${money.length} of ${data.length} startups have publicly disclosed funding amounts — the rest are bootstrapped or undisclosed.`);
  return facts;
}

      <a onclick="nav('s/${prev.id}')" title="${esc(prev.name)}" style="cursor:pointer">← Prev</a>

    </div>
  </div>
  <div class="dhead">
    ${logoBox(s,true)}
    <div class="dtitle">
      <h1>${esc(s.name)}</h1>
      <div class="tg">${esc(s.tagline||'')}</div>
      <div>
        <span class="chip ${s.stage}">${s.stage}</span>
        <span class="chip">${esc(s.sector||'')}</span>
        ${s.hq?`<span class="chip">${esc(s.hq.split(',')[0])}</span>`:''}
        <span class="chip sask">SASK Alumni</span>
        ${ed?`<span class="chip edition">${ed}</span>`:''}
        ${s._edited?'<span class="chip edited">edited</span>':''}

    </div>
  </div>
  <div class="grid">
    <div>
      <div class="sect"><h2>Overview</h2>
        <div class="kv">
          <div class="k">Founded</div><div>${esc(s.founded||'—')}</div>
          <div class="k">Sector</div><div>${esc(s.sector||'—')}</div>
          <div class="k">Stage</div><div>${s.stage}</div>
          <div class="k">Capital raised</div><div>${esc(s.capital_raised||'—')}</div>
          <div class="k">Headquarters</div><div>${esc(s.hq||'—')}</div>
          <div class="k">Website</div><div>${s.website?`<a href="${esc(s.website)}" target="_blank" style="color:var(--blue)">${esc(s.website.replace(/^https?:\/\//,''))}</a>`:'—'}</div>
        </div>
        ${s.description?`<p style="margin-top:16px;color:#3d3d38;font-size:13.5px;max-width:600px">${esc(s.description)}</p>`:''}
      </div>
      <div class="sect"><h2>Journey & funding history</h2>
        ${s.timeline.length?`<div class="tl">${s.timeline.map(t=>`
          <div class="tli"><b>${esc(t.label)}</b><span>${esc(t.year)}${t.detail?' · '+esc(t.detail):''}</span></div>`).join('')}</div>`:'<p style="color:var(--sub)">No timeline data on file.</p>'}
      </div>
      <div class="sect"><h2>Current status</h2>
        <p style="color:#3d3d38;font-size:13.5px;max-width:620px">${esc(s.current_status||'No status information on file.')}</p>
      </div>
      <div class="sect"><h2>Recent news & mentions</h2>
        ${s.news.length?`<div class="news">${s.news.map(n=>`
          <div class="nitem">
            <div class="ndate">${esc(n.date||'')}</div>
            <div class="nbody"><b>${n.url?`<a href="${esc(n.url)}" target="_blank" rel="noopener">${esc(n.title)}</a>`:esc(n.title)}</b><span>${esc(n.source||'')}</span></div>
            <div class="narrow">→</div>
          </div>`).join('')}</div>`:'<p style="color:var(--sub)">No press mentions on file.</p>'}
      </div>
      ${gal(s).length?`<div class="sect"><h2>Gallery</h2>
        <div class="gal">${gal(s).map((g,i)=>`
          <div class="gitem" onclick="openLB('${s.id}',${i})">
            <img src="${esc(g.src)}" alt="${esc(g.caption||s.name)}" loading="lazy">
            ${g.caption?`<div class="cap">${esc(g.caption)}</div>`:''}

      ${s.sources.length?`<div class="sect"><h2>Sources</h2><div class="srcs">${s.sources.map(u=>`<a href="${esc(u)}" target="_blank" rel="noopener">${esc(u)}</a>`).join('<br>')}</div></div>`:''}
      ${similar.length?`<div class="sect"><h2>Similar startups · ${esc(sectorGroup(s))}</h2>
        <div class="sim">${similar.map(x=>`
          <div class="scard" onclick="nav('s/${x.id}')">
            <div class="top">${logoBox(x)}<div><div class="nm">${esc(x.name)}</div><div class="ed">${[editionOf(x),x.founded?'est. '+x.founded:null].filter(Boolean).join(' · ')||'&nbsp;'}</div></div></div>
            <div class="ch"><span class="chip ${x.stage}">${x.stage}</span>${x.hq?`<span class="chip">${esc(x.hq.split(',')[0])}</span>`:''}</div>

    </div>
    <div>
      <div class="card saskcard"><h3>SASK Journey</h3>
        <div class="p">${esc(s.sask?.participation||'SASK alumni')}</div>
        ${s.sask?.note?`<div class="n">${esc(s.sask.note)}</div>`:''}
      </div>
      <div class="card"><h3>Founders</h3>
        ${s.founders.length?s.founders.map(f=>`
        <div class="founder">
          <div class="fmono">${initials(f.name||'?')}</div>
          <div><b>${esc(f.name)}</b><span>${esc(f.role||'')}</span>${f.email?`<a href="mailto:${esc(f.email)}">${esc(f.email)}</a>`:''}</div>
        </div>`).join(''):'<p style="color:var(--sub);font-size:12.5px">No founder data on file.</p>'}
      </div>
      <div class="card"><h3>Data quality</h3>
        <div class="kv" style="grid-template-columns:100px 1fr;font-size:12.5px">
          <div class="k">Confidence</div><div style="text-transform:capitalize">${esc(s.confidence||'—')}</div>
          <div class="k">Last research</div><div>Jul 2026</div>
        </div>
        <p class="conf" style="margin-top:10px">Compiled from public sources. Verify before external use.</p>
      </div>
    </div>
  </div>
  <footer><span>© 2026 SASK · Alumni Database</span><span></span></footer>`;
}

/* ---------- edit mode ---------- */
function startEdit(id){if(READONLY)return;editing=true;draft=JSON.parse(JSON.stringify(byId(id)));delete draft._edited;render();}
function renderEdit(){
  const s=draft;
  const app=document.getElementById('app');
  app.innerHTML=`
  <div class="editable" style="padding-bottom:90px">
  <button class="back" onclick="cancelEdit()">← Cancel editing</button>
  <div class="dhead">
    <div style="display:flex;flex-direction:column;gap:8px;align-items:center">
      ${logoBox(s,true)}
      <input type="file" id="logofile" accept="image/*" style="display:none" onchange="logoUpload(this)">
      <button class="hbtn" style="font-size:11px;padding:5px 12px" onclick="document.getElementById('logofile').click()">Upload logo</button>
      ${s.logo?'<button class="hbtn" style="font-size:11px;padding:5px 12px;color:var(--red-ink)" onclick="logoRemove()">Remove</button>':''}
    </div>
    <div class="dtitle" style="display:flex;flex-direction:column;gap:8px">
      <input class="ef" style="font-size:26px;font-weight:800" data-f="name" value="${esc(s.name)}" placeholder="Name">
      <input class="ef" data-f="tagline" value="${esc(s.tagline||'')}" placeholder="Tagline">
    </div>
  </div>
  <div class="grid">
    <div>
      <div class="sect"><h2>Overview</h2>
        <div class="kv" style="row-gap:8px">
          <div class="k">Founded</div><input class="ef" data-f="founded" value="${esc(s.founded||'')}">
          <div class="k">Sector</div><input class="ef" data-f="sector" value="${esc(s.sector||'')}">
          <div class="k">Stage</div><select class="ef" data-f="stage">${['Active','Acquired','Exited','Inactive','Unknown'].map(x=>`<option${s.stage===x?' selected':''}>${x}</option>`).join('')}</select>
          <div class="k">Capital raised</div><input class="ef" data-f="capital_raised" value="${esc(s.capital_raised||'')}">
          <div class="k">Headquarters</div><input class="ef" data-f="hq" value="${esc(s.hq||'')}">
          <div class="k">Website</div><input class="ef" data-f="website" value="${esc(s.website||'')}">
          <div class="k">Logo URL</div><input class="ef" data-f="logo" value="${s.logo&&s.logo.startsWith('data:')?'':esc(s.logo||'')}" placeholder="https://… or use Upload logo">
          <div class="k">Confidence</div><select class="ef" data-f="confidence">${['high','medium','low'].map(x=>`<option${s.confidence===x?' selected':''}>${x}</option>`).join('')}</select>
        </div>
        <div style="margin-top:14px"><div class="k" style="color:var(--sub);margin-bottom:5px">Description</div>
        <textarea class="ef" data-f="description">${esc(s.description||'')}</textarea></div>
        <div style="margin-top:14px"><div class="k" style="color:var(--sub);margin-bottom:5px">Current status</div>
        <textarea class="ef" data-f="current_status">${esc(s.current_status||'')}</textarea></div>
      </div>
      <div class="sect"><h2>Timeline</h2>
        <div id="e-tl">${s.timeline.map((t,i)=>`
          <div class="erow">
            <input class="ef" style="max-width:70px" data-tl="${i}" data-k="year" value="${esc(t.year||'')}" placeholder="Year">
            <input class="ef" data-tl="${i}" data-k="label" value="${esc(t.label||'')}" placeholder="Event">
            <input class="ef" data-tl="${i}" data-k="detail" value="${esc(t.detail||'')}" placeholder="Detail">
            <button class="del" onclick="draftDel('timeline',${i})">×</button>
          </div>`).join('')}</div>
        <button class="addrow" onclick="draftAdd('timeline',{year:'',label:'',detail:''})">+ Add timeline event</button>
      </div>
      <div class="sect"><h2>News & mentions</h2>
        <div id="e-news">${s.news.map((n,i)=>`
          <div class="erow">
            <input class="ef" style="max-width:90px" data-nw="${i}" data-k="date" value="${esc(n.date||'')}" placeholder="YYYY-MM">
            <input class="ef" data-nw="${i}" data-k="title" value="${esc(n.title||'')}" placeholder="Title">
            <input class="ef" style="max-width:110px" data-nw="${i}" data-k="source" value="${esc(n.source||'')}" placeholder="Source">
            <input class="ef" style="max-width:150px" data-nw="${i}" data-k="url" value="${esc(n.url||'')}" placeholder="URL">
            <button class="del" onclick="draftDel('news',${i})">×</button>
          </div>`).join('')}</div>
        <button class="addrow" onclick="draftAdd('news',{date:'',title:'',source:'',url:''})">+ Add news item</button>
      </div>
      <div class="sect"><h2>Mini gallery</h2>
        <div class="galedit">${gal(s).map((g,i)=>`
          <div class="gitem">
            <img src="${esc(g.src)}" alt="">
            <button class="del" onclick="galDel(${i})">×</button>
            <input data-gl="${i}" data-k="caption" value="${esc(g.caption||'')}" placeholder="Caption (optional)">
          </div>`).join('')}</div>
        <div style="display:flex;gap:8px;flex-wrap:wrap">
          <input type="file" id="galfile" accept="image/*" multiple style="display:none" onchange="galUpload(this)">
          <button class="addrow" style="flex:1" onclick="document.getElementById('galfile').click()">+ Upload images</button>
          <button class="addrow" style="flex:1" onclick="galAddUrl()">+ Add image by URL</button>
        </div>
      </div>
      <div class="sect"><h2>Sources (one per line)</h2>
        <textarea class="ef" data-f="_sources" style="min-height:90px">${esc(s.sources.join('\n'))}</textarea>
      </div>
    </div>
    <div>
      <div class="card saskcard"><h3>SASK Journey</h3>
        <input class="ef" data-sask="participation" value="${esc(s.sask?.participation||'')}" placeholder="e.g. Startup Awards 2015 winner" style="margin-bottom:7px">
        <textarea class="ef" data-sask="note" placeholder="Note">${esc(s.sask?.note||'')}</textarea>
      </div>
      <div class="card"><h3>Founders</h3>
        <div id="e-founders">${s.founders.map((f,i)=>`
          <div style="border-bottom:1px solid #F3F3F5;padding:7px 0">
            <div class="erow" style="margin-bottom:5px">
              <input class="ef" data-fd="${i}" data-k="name" value="${esc(f.name||'')}" placeholder="Name">
              <button class="del" onclick="draftDel('founders',${i})">×</button>
            </div>
            <div class="erow" style="margin-bottom:0">
              <input class="ef" data-fd="${i}" data-k="role" value="${esc(f.role||'')}" placeholder="Role">
              <input class="ef" data-fd="${i}" data-k="email" value="${esc(f.email||'')}" placeholder="Email">
            </div>
          </div>`).join('')}</div>
        <button class="addrow" style="margin-top:8px" onclick="draftAdd('founders',{name:'',role:'Co-founder',email:''})">+ Add founder</button>
      </div>
      <div class="card"><h3>Danger zone</h3>
        <button class="hbtn" style="color:var(--red-ink);border-color:#e8cfc7" onclick="deleteStartup('${s.id}')">Remove from database</button>
      </div>
    </div>
  </div>
  </div>
  <div class="ebar"><div class="wrap">
    <span>Editing <b>${esc(s.name)}</b> — changes are stored locally in this browser.</span>
    <button onclick="cancelEdit()">Cancel</button>
    <button class="save" onclick="saveEdit()">Save changes</button>
  </div></div>`;
  app.querySelectorAll('[data-f],[data-sask],[data-tl],[data-nw],[data-fd],[data-gl]').forEach(el=>{
    el.addEventListener('input',()=>syncDraft(el));
    el.addEventListener('change',()=>syncDraft(el));
  });
}
function syncDraft(el){
  const v=el.value;
  if(el.dataset.f==='_sources'){draft.sources=v.split('\n').map(x=>x.trim()).filter(Boolean);return;}
  if(el.dataset.f){draft[el.dataset.f]=v;return;}
  if(el.dataset.sask){draft.sask=draft.sask||{};draft.sask[el.dataset.sask]=v;return;}
  if(el.dataset.tl!==undefined&&el.dataset.tl!==''){draft.timeline[+el.dataset.tl][el.dataset.k]=v;return;}
  if(el.dataset.nw!==undefined&&el.dataset.nw!==''){draft.news[+el.dataset.nw][el.dataset.k]=v;return;}
  if(el.dataset.fd!==undefined&&el.dataset.fd!==''){draft.founders[+el.dataset.fd][el.dataset.k]=v;return;}
  if(el.dataset.gl!==undefined&&el.dataset.gl!==''){draft.gallery[+el.dataset.gl][el.dataset.k]=v;return;}
}
/* gallery editing */
function resizeImg(dataUrl,max,cb){
  const img=new Image();
  img.onload=()=>{try{
    const sc=Math.min(1,max/Math.max(img.width,img.height));
    const c=document.createElement('canvas');c.width=Math.round(img.width*sc)||1;c.height=Math.round(img.height*sc)||1;
    c.getContext('2d').drawImage(img,0,0,c.width,c.height);
    cb(c.toDataURL('image/jpeg',0.82));
  }catch(e){cb(dataUrl);}};
  img.onerror=()=>cb(dataUrl);
  img.src=dataUrl;
}
function galUpload(inp){
  const files=[...inp.files];if(!files.length)return;
  draft.gallery=gal(draft);
  let pending=files.length;
  files.forEach(file=>{
    const r=new FileReader();
    r.onload=()=>resizeImg(r.result,900,url=>{
      draft.gallery.push({src:url,caption:''});
      if(--pending===0){renderEdit();toast(files.length+' image(s) added — remember to Save');}
    });
    r.readAsDataURL(file);
  });
}
function galAddUrl(){
  const u=prompt('Image URL:');if(!u)return;
  draft.gallery=gal(draft);draft.gallery.push({src:u.trim(),caption:''});renderEdit();
}
function galDel(i){draft.gallery.splice(i,1);renderEdit();}
/* lightbox */
let lbState=null;
function openLB(id,i){lbState={id,i};drawLB();}
function drawLB(){
  closeLB(false);
  const s=byId(lbState.id);const items=gal(s);if(!items.length)return;
  lbState.i=(lbState.i+items.length)%items.length;
  const g=items[lbState.i];
  const d=document.createElement('div');d.className='lb';d.id='lb';
  d.onclick=e=>{if(e.target===d)closeLB();};
  d.innerHTML=`<img src="${esc(g.src)}" alt="">
    ${g.caption?`<div class="lcap">${esc(g.caption)}</div>`:''}
    <div class="lcap" style="opacity:.5;font-size:11px">${lbState.i+1} / ${items.length}</div>
    <button class="lx" onclick="closeLB()">×</button>
    ${items.length>1?`<button class="lp" onclick="lbState.i--;drawLB()">←</button><button class="ln" onclick="lbState.i++;drawLB()">→</button>`:''}`;
  document.body.appendChild(d);
}
function closeLB(clear=true){const d=document.getElementById('lb');if(d)d.remove();if(clear)lbState=null;}
document.addEventListener('keydown',e=>{
  if(!document.getElementById('lb'))return;
  if(e.key==='Escape')closeLB();
  if(e.key==='ArrowLeft'){lbState.i--;drawLB();}
  if(e.key==='ArrowRight'){lbState.i++;drawLB();}
});
function logoUpload(inp){
  const file=inp.files[0];if(!file)return;
  const r=new FileReader();
  r.onload=()=>{
    const img=new Image();
    img.onload=()=>{
      try{
        const max=256, sc=Math.min(1,max/Math.max(img.width,img.height));
        const c=document.createElement('canvas');c.width=Math.round(img.width*sc)||1;c.height=Math.round(img.height*sc)||1;
        c.getContext('2d').drawImage(img,0,0,c.width,c.height);
        draft.logo=c.toDataURL('image/png');
      }catch(e){draft.logo=r.result;}
      renderEdit();toast('Logo added — remember to Save');
    };
    img.onerror=()=>{draft.logo=r.result;renderEdit();};
    img.src=r.result;
  };
  r.readAsDataURL(file);
}
function logoRemove(){draft.logo='';renderEdit();}
function draftAdd(arr,obj){draft[arr].push(obj);renderEdit();}
function draftDel(arr,i){draft[arr].splice(i,1);renderEdit();}
function cancelEdit(){editing=false;draft=null;render();}
function saveEdit(){
  const id=draft.id;
  const isAdded=added.some(a=>a.id===id);
  if(isAdded){added=added.map(a=>a.id===id?draft:a);}
  else{overrides[id]=draft;}
  persist();editing=false;draft=null;toast('Saved locally ✓');nav('s/'+id);render();
}
function deleteStartup(id){
  if(!confirm('Remove this startup from the database? (Reversible via Reset edits / re-import)'))return;
  if(added.some(a=>a.id===id)){added=added.filter(a=>a.id!==id);}
  else{removed.push(id);delete overrides[id];}
  persist();editing=false;draft=null;toast('Removed');nav('');
}
function addStartup(){
  if(READONLY)return;
  const name=prompt('Startup name:');if(!name)return;
  const id='custom-'+name.toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'');
  if(byId(id)){toast('Already exists');return;}
  added.push({id,name,logo:'',gallery:[],tagline:'',description:'',founded:'',sector:'',tags:[],stage:'Active',capital_raised:'',hq:'',website:'',founders:[],sask:{participation:'',note:''},timeline:[],current_status:'',news:[],sources:[],confidence:'low'});
  persist();editing=true;draft=JSON.parse(JSON.stringify(added[added.length-1]));nav('s/'+id);
}
/* ---------- import/export ---------- */
function exportJSON(){
  const blob=new Blob([JSON.stringify(getData().map(({_edited,...r})=>r),null,1)],{type:'application/json'});
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='sask_alumni_database.json';a.click();
  toast('Exported '+getData().length+' profiles');
}
function exportCSV(){
  const cols=['name','tagline','founded','sector','stage','capital_raised','hq','website','sask_participation','founders','founder_emails','current_status','confidence'];
  const cell=v=>'"'+String(v??'').replace(/"/g,'""')+'"';
  const rows=getData().map(s=>[s.name,s.tagline,s.founded,s.sector,s.stage,s.capital_raised,s.hq,s.website,
    s.sask?.participation,s.founders.map(f=>f.name).join('; '),s.founders.map(f=>f.email).filter(Boolean).join('; '),
    s.current_status,s.confidence].map(cell).join(','));
  const blob=new Blob(['﻿'+cols.join(',')+'\n'+rows.join('\n')],{type:'text/csv;charset=utf-8'});
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='sask_alumni_database.csv';a.click();
  toast('CSV exported');
}
function importJSON(inp){
  if(READONLY)return;
  const file=inp.files[0];if(!file)return;
  const r=new FileReader();
  r.onload=()=>{try{
    const arr=JSON.parse(r.result);
    if(!Array.isArray(arr))throw 0;
    overrides={};added=[];removed=[];
    const seedIds=new Set(SEED.map(s=>s.id));
    arr.forEach(s=>{if(seedIds.has(s.id)){overrides[s.id]=s;}else{added.push(s);}});
    SEED.forEach(s=>{if(!arr.some(x=>x.id===s.id))removed.push(s.id);});
    persist();render();toast('Imported '+arr.length+' profiles');
  }catch(e){toast('Invalid JSON file');}};
  r.readAsText(file);inp.value='';
}
function resetEdits(){
  if(READONLY)return;
  if(!confirm('Discard all local edits and restore the original researched data?'))return;
  overrides={};added=[];removed=[];persist();editing=false;draft=null;render();toast('Restored original data');
}
if(READONLY)document.body.classList.add('readonly');
render();
</script>
